# MISP Development LXC Container Configuration

# Container Settings
CONTAINER_NAME="misp-development"
CONTAINER_IMAGE="ubuntu:22.04"

# Resource Limits
CONTAINER_MEMORY="4GB"
CONTAINER_CPU_SHARES="2"

# MISP Settings
MISP_INSTALL_DIR="/opt/MISP"
MISP_WEB_PORT="8080"

# Network Settings
CONTAINER_NETWORK_MODE="bridge"
CONTAINER_IP_ADDRESS=""  # Leave empty for DHCP

# Storage Settings
CONTAINER_STORAGE_POOL="default"
